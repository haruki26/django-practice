{% extends "psys/base.html" %}
{% load static %}
{% block title %}得意先管理メニュー | 販売支援システム{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'psys/css/pages/customers.css' %}" />
{% endblock %}
{% block content %}
<section class="page-section">
  <header class="section__header">
    <h2>得意先管理メニュー</h2>
    <p class="section__description">実装予定の各操作にアクセスできます。</p>
  </header>
  <div class="menu-list">
    {% for label, url in actions %}
    <a class="menu-list__item" href="{{ url }}">{{ label }}</a>
    {% endfor %}
  </div>
  <div class="form__actions">
    <a class="button button--secondary" href="{% url 'psys:main-menu' %}">メインメニューに戻る</a>
  </div>
</section>
{% endblock %}
